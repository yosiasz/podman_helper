version: "3.9"

services:
  k3s:
    image: rancher/k3s:v1.30.3-k3s1
    #image: bitnami/k3s:latest
    #image: kindest/node:latest
    container_name: kind
    privileged: true
    restart: unless-stopped
    ports:
      - "6443:6443"     # Kubernetes API
      #- "80:80"         # Optional: NodePort service
      #- "443:443"       # Optional: NodePort service
    command: server --disable traefik   # <-- explicitly run in server mode

    environment:
      K3S_KUBECONFIG_OUTPUT: "/output/kubeconfig.yaml"   # export kubeconfig
      K3S_KUBECONFIG_MODE: "644"
    volumes:
      #- /var/run/docker.sock:/var/run/docker.sock
      #- k3s-data:/var/lib/rancher/k3s
      - ./.kube:/root/.kube
      - k3s-data:/var/lib/rancher/k3s         # persist cluster data
      - ./kubeconfig:/output                  # mount host folder for kubeconfig

volumes:
  k3s-data: