#podman run -d -p 8000:8000 ghcr.io/chroma-core/chroma:latest
#podman-compose -f .\containers\docker-chromadb.yaml up -d --force-recreate
version: '3.9'

networks:
  net:
    driver: bridge
services:
  server:
    name: chromadb
    #image: ghcr.io/chroma-core/chroma:0.6.2
    image: chromadb/chroma:0.6.2
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      # Default configuration for persist_directory in chromadb/config.py
      # Currently it's located in "/chroma/chroma/"
      - chroma-data:/chroma/chroma/
      #- ../../.podman_volumes/chromadb/chroma-data:/chroma/chroma/
    ports:
      - 8000:8000
    networks:
      - net

volumes:
  chroma-data:
    driver: local