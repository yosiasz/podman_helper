# Use root/example as user/password credentials
version: "3.8"
services:
  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    ports:
      - "5500:3000"
  mcp-server:
    #SSE mode by default
    #most users will want to use STDIO mode
    #
    image: mcp/grafana:latest
    container_name: mcp-server
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_SERVICE_ACCOUNT_TOKEN="glsa_bDQW9euhCpaoiWVpuuKgXZlzkFY7o4IV_5f0d3cc4"
    ports:
      - "8000:8000"
    #stdin_open: true # equivalent to -i
    #command: ["-t", "sse"]
    #-p 8000:8000 
    restart: unless-stopped
    depends_on:
      - grafana
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    depends_on:
      - grafana
