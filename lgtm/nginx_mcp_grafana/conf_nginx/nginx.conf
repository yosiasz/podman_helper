events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    upstream mcp_backend {
        server mcp-server:8000;
    }
    server {
            listen 80;

            # Health check
            location /health {
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }

            # Regular requests to main tribe
            location /main {
                proxy_pass http://mcp_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            # SSE streaming endpoint for main tribe
            location /main/sse {
                proxy_pass http://mcp_backend/sse;
                proxy_http_version 1.1;
                chunked_transfer_encoding off;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_cache off;
                proxy_read_timeout 86400;
                proxy_max_temp_file_size 0;
            }

            # Default route - return 404 for unknown paths
            location / {
                return 404 "Tribe not found. Available tribes:main\n";
                add_header Content-Type text/plain;
            }
        }
    }
